<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hall Availability</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f5f9;
        }

        header {
            background: #142d4e;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 850px;
            background: white;
            margin: 35px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ddd;
        }

        h1 {
            text-align: center;
            color: #142d4e;
            margin-bottom: 15px;
        }

        .hall-name {
            text-align: center;
            color: #e67e22;
            font-size: 20px;
            margin-bottom: 25px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header button {
            background: #1e6091;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        #monthYear {
            font-size: 22px;
            color: #142d4e;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day-name {
            text-align: center;
            font-weight: bold;
            padding: 12px 2px;
            color: #142d4e;
        }

        .date {
            padding: 16px 5px;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .empty {
            background: transparent;
        }

        .available {
            background: #b8e6c5;
            color: #176b35;
        }

        .booked {
            background: #f5b5b5;
            color: #a00000;
            cursor: not-allowed;
        }
        .partial {
    background: #ffe0a3;
    color: #875000;
    cursor: pointer;
}

        .selected {
            background: #2878d0;
            color: white;
        }

        .past {
            background: #e0e0e0;
            color: #888;
            cursor: not-allowed;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        .legend span {
            padding: 9px 12px;
            border-radius: 5px;
            font-size: 14px;
        }

        .selected-info {
            text-align: center;
            margin: 20px;
            color: #142d4e;
            font-size: 17px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .buttons button {
            padding: 13px 22px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .confirm {
            background: #239b56;
        }

        .back {
            background: #555;
        }

        footer {
            background: #142d4e;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        @media(max-width: 600px) {

            .container {
                margin: 15px;
                padding: 15px;
            }

            .date {
                padding: 13px 2px;
                font-size: 13px;
            }

            .calendar {
                gap: 4px;
            }

        }

    </style>

</head>

<body>

    <header>

        <h2>Community Hall Booking</h2>

        <a href="dashboard.html">Home</a>

    </header>


    <div class="container">

        <h1>Check Hall Availability</h1>

        <div class="hall-name" id="hallName">
            Community Hall
        </div>


        <div class="calendar-header">

            <button onclick="changeMonth(-1)">
                Previous
            </button>

            <h2 id="monthYear"></h2>

            <button onclick="changeMonth(1)">
                Next
            </button>

        </div>


        <div class="calendar" id="calendar">

        </div>


        <div class="legend">

            <span class="available">Available</span>

            <span class="partial">Partially Booked</span>
            <span class="booked">Booked</span>
            <span class="selected">Selected</span>
            

        </div>


        <div class="selected-info">

            <p id="selectedDate">
                Please select an available date.
            </p>

        </div>
        <div id="timeSlots" style="
    display:none;
    margin:25px auto;
    max-width:500px;
    padding:20px;
    background:#f2f5f9;
    border-radius:10px;
">

    <h3 style="color:#142d4e; margin-bottom:15px;">
        Available Time Slots
    </h3>

    <div id="slotList"></div>

</div>


        <div class="buttons">

            <button class="confirm" onclick="confirmDate()">
                Confirm Date
            </button>

            <button class="back" onclick="goBack()">
                Back to Hall Details
            </button>

        </div>

    </div>


    <footer>

        <p>
            © 2026 Community Hall Booking and Management System
        </p>

    </footer>
    <script>


    const params = new URLSearchParams(window.location.search);

const hall = params.get("hall") || localStorage.getItem("selectedHall");
const hallId = Number(
    params.get("hall_id") || localStorage.getItem("selectedHallId")
);

document.getElementById("hallName").innerText =
    hall || "Community Hall";

let today = new Date();
let currentMonth = today.getMonth();
let currentYear = today.getFullYear();

let selectedDay = null;
let selectedSlot = null;
let bookings = [];

const slots = {
    morning: ["08:00:00", "12:00:00", "Morning (8 AM - 12 PM)"],
    afternoon: ["12:00:00", "16:00:00", "Afternoon (12 PM - 4 PM)"],
    evening: ["16:00:00", "22:00:00", "Evening (4 PM - 10 PM)"],
    full_day: ["08:00:00", "22:00:00", "Full Day (8 AM - 10 PM)"]
};

function dateKey(year, month, day) {
    return year + "-" +
        String(month + 1).padStart(2, "0") + "-" +
        String(day).padStart(2, "0");
}

function isPast(date) {
    return new Date(date + "T00:00:00") <
        new Date(today.getFullYear(), today.getMonth(), today.getDate());
}

function timeToMinutes(time) {
    const parts = time.split(":");
    return Number(parts[0]) * 60 + Number(parts[1]);
}

function isSlotBooked(date, slot) {
    const start = timeToMinutes(slots[slot][0]);
    const end = timeToMinutes(slots[slot][1]);

    return bookings.some(booking => {

        if (booking.event_date !== date) {
            return false;
        }

        const bookedStart = timeToMinutes(booking.start_time);
        const bookedEnd = timeToMinutes(booking.end_time);

        return bookedStart < end && bookedEnd > start;
    });
}

function generateCalendar() {

    const calendar = document.getElementById("calendar");
    calendar.innerHTML = "";

    const monthNames = [
        "January", "February", "March",
        "April", "May", "June",
        "July", "August", "September",
        "October", "November", "December"
    ];

    document.getElementById("monthYear").innerText =
        monthNames[currentMonth] + " " + currentYear;

    const firstDay =
        new Date(currentYear, currentMonth, 1).getDay();

    const totalDays =
        new Date(currentYear, currentMonth + 1, 0).getDate();

    ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
        .forEach(day => {
            const div = document.createElement("div");
            div.className = "day-name";
            div.innerText = day;
            calendar.appendChild(div);
        });

    for (let i = 0; i < firstDay; i++) {
        calendar.appendChild(document.createElement("div"));
    }

    for (let day = 1; day <= totalDays; day++) {

        const date = document.createElement("div");
        date.className = "date";
        date.innerText = day;

        const key = dateKey(currentYear, currentMonth, day);

        const morning = isSlotBooked(key, "morning");
        const afternoon = isSlotBooked(key, "afternoon");
        const evening = isSlotBooked(key, "evening");

        const bookedCount =
            [morning, afternoon, evening].filter(Boolean).length;

        if (isPast(key)) {
            date.classList.add("past");
        } else if (bookedCount === 3) {
            date.classList.add("booked");
        } else if (bookedCount > 0) {
            date.classList.add("partial");
        } else {
            date.classList.add("available");
        }

        if (selectedDay === key) {
            date.classList.add("selected");
        }

        if (!isPast(key) && bookedCount < 3) {
            date.onclick = function() {
                selectedDay = key;
                selectedSlot = null;

                document.getElementById("selectedDate").innerText =
                    "Selected Date: " + key;

                showTimeSlots(key);
                generateCalendar();
            };
        }

        calendar.appendChild(date);
    }
}

function showTimeSlots(date) {

    const section = document.getElementById("timeSlots");
    const list = document.getElementById("slotList");

    section.style.display = "block";
    list.innerHTML = "";

    Object.keys(slots).forEach(slot => {

        const booked = isSlotBooked(date, slot);

        const row = document.createElement("div");

        row.style.cssText =
            "display:flex;justify-content:space-between;" +
            "align-items:center;padding:12px;margin-bottom:10px;" +
            "background:white;border-radius:6px;gap:8px;";

        const name = document.createElement("span");
        name.innerText = slots[slot][2];

        const button = document.createElement("button");

        button.type = "button";
        button.style.cssText =
            "padding:9px 12px;border:0;border-radius:5px;" +
            "color:white;min-width:105px;";

        if (booked) {

            button.innerText = "Booked";
            button.style.background = "#c62828";
            button.disabled = true;

        } else {

            button.innerText =
                selectedSlot === slot ? "Selected" : "Available";

            button.style.background =
                selectedSlot === slot ? "#2878d0" : "#239b56";

            button.onclick = function() {
                selectedSlot = slot;
                showTimeSlots(date);
            };
        }

        row.appendChild(name);
        row.appendChild(button);
        list.appendChild(row);
    });
}

async function loadBookings() {

    if (!hallId) {
        alert("Please select a valid hall.");
        window.location.href = "dashboard.php";
        return;
    }

    try {

        const response = await fetch(
            "availability_data.php?hall_id=" + hallId +
            "&month=" + (currentMonth + 1) +
            "&year=" + currentYear
        );

        const data = await response.json();

        if (data.error) {
            alert(data.error);
            return;
        }

        bookings = data.bookings || [];
        console.log("Bookings received:",bookings);

        generateCalendar();

        if (selectedDay) {
            showTimeSlots(selectedDay);
        }

    } catch (error) {
        alert("Unable to load availability. Please try again.");
        console.error(error);
    }
}

function changeMonth(value) {

    currentMonth += value;

    if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
    }

    if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
    }

    selectedDay = null;
    selectedSlot = null;

    document.getElementById("selectedDate").innerText =
        "Please select a date.";

    document.getElementById("timeSlots").style.display = "none";

    loadBookings();
}

function confirmDate() {

    if (!selectedDay) {
        alert("Please select a date.");
        return;
    }

    if (!selectedSlot) {
        alert("Please select an available time slot.");
        return;
    }

    localStorage.setItem("selectedHall", hall);
    localStorage.setItem("selectedHallId", hallId);
    localStorage.setItem("bookingDate", selectedDay);

    window.location.href =
        "booking.html?hall=" + encodeURIComponent(hall) +
        "&hall_id=" + hallId +
        "&date=" + encodeURIComponent(selectedDay) +
        "&time=" + selectedSlot;
}

function goBack() {
    window.location.href =
        "halldetails.php?hall=" + encodeURIComponent(hall);
}

loadBookings();
</script>

</body>

</html>
