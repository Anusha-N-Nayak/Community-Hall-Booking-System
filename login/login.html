<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>User Login</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .login-container {
        background: white;
        width: 400px;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        color: #243b55;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #517fa4;
    }

    button {
        width: 100%;
        padding: 13px;
        background: #243b55;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 17px;
        cursor: pointer;
    }

    button:hover {
        background: #517fa4;
    }

    .register-link {
        text-align: center;
        margin-top: 22px;
    }

    .register-link a {
        color: #243b55;
        text-decoration: none;
        font-weight: bold;
    }

    .home-link {
        text-align: center;
        margin-top: 18px;
    }

    .home-link a {
        color: #517fa4;
        text-decoration: none;
    }

</style>

</head><body><div class="login-container">

    <h2>Welcome Back!</h2>

    <p class="subtitle">Login to Your Account</p>

    <form action="login.php" method="post">

        <label>Email Address</label>

        <input type="email"
               name="email"
               placeholder="Enter your email"
               required>

        <label>Password</label>

        <input type="password"
               name="password"
               placeholder="Enter your password"
               required>

        <button type="submit">Login</button>

    </form>

    <div class="register-link">

        Don't have an account?
        <a href="register.html">Register</a>

    </div>

    <div class="home-link">

        <a href="index.html">← Back to Home</a>

    </div>

</div>

</body></html>
